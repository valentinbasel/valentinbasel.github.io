# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Dr. Valentín Basel
email: valentinbasel@unc.edu.ar
description: >- # this means to ignore newlines until "baseurl:"
 En este sitio comparto mis proyectos de software y hardware, publicaciones, materiales educativos, investigaciones y otros trabajos relacionados con la informática y la educación.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://valentinbasel.github.io" # the base hostname & protocol for your site, e.g. http://example.com
# twitter_username: jekyllrb

github_username:  valentinbasel
#twitter_username:  valentinbasel
#instagram_username:  valentinbasel

# Build settings
theme: minima
plugins:
  - jekyll-feed

